name: Validate redis-pvxs-ioc image

on:
  pull_request:
    branches:
      - main
      - 'dev/**'
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  validate:
    # Untrusted pull-request code must not run on Fermilab self-hosted runners.
    # Push/manual validation remains on the release-equivalent adlinux3 host.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'adlinux3' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate release tooling
        run: python3 -m unittest discover -s tests -p '*_tools_test.py' -v

      - name: Build validation image
        id: build
        run: |
          VERSION="$(tr -d '\n' < VERSION)"
          REVISION="$(git rev-parse HEAD)"
          IMAGE="redis-pvxs-ioc:ci-${GITHUB_SHA}"

          docker build \
            --platform linux/amd64 \
            --build-arg REDIS_PVXS_IOC_VERSION="${VERSION}" \
            --build-arg REDIS_PVXS_IOC_REVISION="${REVISION}" \
            --build-arg REDIS_PVXS_IOC_SOURCE="https://github.com/fermi-ad/redis-pvxs-ioc" \
            -t "${IMAGE}" \
            .

          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"

      - name: Validate image metadata
        run: |
          IMAGE="${{ steps.build.outputs.image }}"
          VERSION="${{ steps.build.outputs.version }}"
          REVISION="${{ steps.build.outputs.revision }}"

          test "$(docker image inspect "${IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "${VERSION}"
          test "$(docker image inspect "${IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${REVISION}"
          test "$(docker image inspect "${IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "BSD-3-Clause"

      - name: Validate runtime image
        run: |
          IMAGE="${{ steps.build.outputs.image }}"
          VERSION="${{ steps.build.outputs.version }}"
          REVISION="${{ steps.build.outputs.revision }}"

          docker run --rm "${IMAGE}" --version | tee /tmp/redis-pvxs-ioc-version.txt
          grep -F "redis-pvxs-ioc ${VERSION} (${REVISION})" /tmp/redis-pvxs-ioc-version.txt
          docker run --rm "${IMAGE}" --check-config /etc/redis-pvxs-ioc/config.yaml
          docker run --rm --entrypoint /bin/sh "${IMAGE}" -c \
            'test -r /usr/share/doc/redis-pvxs-ioc/LICENSE && test -r /usr/share/doc/redis-pvxs-ioc/NOTICE && test -r /usr/share/doc/redis-pvxs-ioc/THIRD_PARTY_NOTICES.md'
          docker run --rm --entrypoint /bin/sh "${IMAGE}" -ec '
            cd /usr/share/doc/redis-pvxs-ioc
            test -s builder-packages.tsv && test -s runtime-packages.tsv
            for file in epics-base/LICENSE pvxs/LICENSE pvxs/COPYRIGHT \
                pvxs/bundle/libevent/LICENSE redis-adapter/LICENSE \
                redis-adapter/hiredis/COPYING redis-adapter/redis-plus-plus/LICENSE \
                yaml-cpp/LICENSE; do
              test -s "third-party/third_party/$file"
            done
            test -s /usr/share/doc/libgrpc++1.51t64/copyright
            test -s /usr/share/doc/libprotobuf32t64/copyright
          '

      - name: Validate runtime identity and secret mounts
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: python3 tests/container_runtime.py "$IMAGE"

      - name: Validate isolated Redis/PVA and access behavior
        env:
          REDIS_PVXS_IOC_IMAGE: ${{ steps.build.outputs.image }}
          REDIS_PVXS_IOC_PULL_POLICY: never
          REDIS_IMAGE: redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
        run: |
          ./scripts/smoke-test.sh
          ./scripts/access-e2e-test.sh

      - name: Retain isolated image test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/smoke-run.*/
            build/access-e2e-run.*/
          retention-days: 14
          if-no-files-found: warn
