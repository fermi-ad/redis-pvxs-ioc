name: Publish redis-pvxs-ioc release image

# Tag pushes do not build or publish. Promotion explicitly names successful
# evidence from the same merged commit and never rebuilds the tested artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching VERSION.
        required: true
        type: string
      candidate_run:
        description: Successful candidate-image workflow run for this exact commit.
        required: true
        type: string
      qualification_run:
        description: Successful qualification run; mandatory for stable 0.9.0 and later.
        required: false
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write
  actions: read

concurrency:
  group: redis-pvxs-ioc-release-promotion
  cancel-in-progress: false

jobs:
  publish-release:
    if: github.ref == 'refs/heads/main'
    runs-on: adlinux3
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      QUALIFICATION_RUN: ${{ inputs.qualification_run }}
      REDIS_IMAGE: redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Isolate registry credentials
        run: |
          DOCKER_CONFIG="$(mktemp -d "${RUNNER_TEMP}/redis-pvxs-docker.XXXXXXXX")"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Verify tag ancestry before executing its release code
        shell: bash
        run: |
          git fetch origin main --tags
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a version tag" >&2; exit 1 ;;
          esac
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          git checkout --detach "$TAG_COMMIT"
      - name: Registry login
        env:
          REGISTRY_USERNAME: ${{ secrets.ADREGISTRY_INST_USERNAME }}
          REGISTRY_SECRET: ${{ secrets.ADREGISTRY_INST_SECRET }}
        run: |
          printf '%s' "$REGISTRY_SECRET" | docker login adregistry.fnal.gov \
            --username "$REGISTRY_USERNAME" --password-stdin
      - name: Validate evidence and promote the existing digest
        run: |
          python3 scripts/release-image.py promote --tag "$RELEASE_TAG" \
            --candidate-run "$CANDIDATE_RUN" --qualification-run "$QUALIFICATION_RUN"
      - name: Docker logout
        if: always() && env.DOCKER_CONFIG != ''
        run: docker logout adregistry.fnal.gov
