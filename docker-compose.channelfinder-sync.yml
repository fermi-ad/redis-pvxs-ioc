services:
  channelfinder-sync:
    image: ${REDIS_PVXS_IOC_IMAGE:-adregistry.fnal.gov/instrumentation/redis-pvxs-ioc:v0.9.0@sha256:79ecf695a4096523d6396988c669dbef0c35eed8c178b348c4ce518da1209a43}
    container_name: redis-pvxs-ioc-channelfinder-sync
    profiles:
      - channelfinder
    networks:
      - redis-pvxs-ioc
    entrypoint: ["/opt/redis-pvxs-ioc/bin/redis-pvxs-channelfinder-sync"]
    command: ["--config", "/etc/redis-pvxs-ioc/config.yaml", "--dry-run"]
    environment:
      CHANNELFINDER_USERNAME: ${CHANNELFINDER_USERNAME:-}
      CHANNELFINDER_PASSWORD: ${CHANNELFINDER_PASSWORD:-}
      CHANNELFINDER_USERNAME_FILE: ${CHANNELFINDER_USERNAME_FILE:-}
      CHANNELFINDER_PASSWORD_FILE: ${CHANNELFINDER_PASSWORD_FILE:-}
    volumes:
      - ${REDIS_PVXS_IOC_CONFIG:-./demo/config.yaml}:/etc/redis-pvxs-ioc/config.yaml:ro
