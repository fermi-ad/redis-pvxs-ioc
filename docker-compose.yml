services:
  redis:
    image: ${REDIS_IMAGE:-adregistry.fnal.gov/instrumentation/redis@sha256:365ee40e627b9faf0775c31c7d6eb9e88a2de201e981b28bd5206029375977b6}
    container_name: ${REDIS_CONTAINER_NAME:-redis-pvxs-ioc-redis}
    networks:
      - redis-pvxs-ioc
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  ioc:
    image: ${REDIS_PVXS_IOC_IMAGE:-adregistry.fnal.gov/instrumentation/redis-pvxs-ioc:v0.9.0@sha256:79ecf695a4096523d6396988c669dbef0c35eed8c178b348c4ce518da1209a43}
    container_name: ${REDIS_PVXS_IOC_CONTAINER_NAME:-redis-pvxs-ioc-demo}
    ports:
      - "${RECCASTER_UDP_HOST_PORT:-5049}:5049/udp"
    networks:
      - redis-pvxs-ioc
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${REDIS_PVXS_IOC_CONFIG:-./demo/config.yaml}:/etc/redis-pvxs-ioc/config.yaml:ro

networks:
  redis-pvxs-ioc:
    driver: bridge
