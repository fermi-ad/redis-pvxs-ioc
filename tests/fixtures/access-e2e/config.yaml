server:
  instance: e2e
  namespace: E2E
  interfaces: [0.0.0.0]
  auto_beacon: false

access:
  enabled: true
  file: access.acf
  watch:
    enabled: true
    interval_ms: 100
    settle_ms: 100
  defaults:
    pv: {asg: DATA, asl: 0}
    rpc: {asg: DATA, asl: 0}
    admin_read: {asg: DEFAULT, asl: 0}
    admin_write: {asg: ADMIN, asl: 0}

redis:
  base_key: acf-e2e
  host: acf-e2e-redis
  port: 6379
  workers: 1
  readers: 1

pvs:
  - name: value
    type: float64
    shape: scalar
    read: {key: value}
    write: {key: value}
    initial: 1.0
