syntax = "proto3";
package redis_pvxs_test;
message Request { int32 number = 1; string text = 2; }
message Reply { int32 number = 1; string text = 2; }
service First {
  rpc Value(Request) returns (Reply);
  rpc Sys(Request) returns (Reply);
}
service Second { rpc Value(Request) returns (Reply); }

message Source { string digitizer = 1; }
message Index { int32 index = 1; }
enum Mode { MODE_ZERO = 0; MODE_ONE = 1; }
message StrictRequest {
  int32 number = 1;
  uint32 unsigned_number = 2;
  int64 signed_big = 3;
  uint64 unsigned_big = 4;
  float ratio = 5;
  double fraction = 6;
  bool flag = 7;
  Mode mode = 8;
  string text = 9;
  Source source = 10;
  Index left = 11;
  Index right = 12;
  repeated int32 numbers = 13;
}
message StrictReply { StrictRequest request = 1; uint32 calls = 2; }
message Label { string label = 1; }
service Strict {
  rpc Echo(StrictRequest) returns (StrictReply);
  rpc Other(Label) returns (Label);
}
message Recursive { Recursive child = 1; }
service Unsupported { rpc Value(Request) returns (Recursive); }

message Empty {}
message ControlRequest { int32 delay_ms = 1; string token = 2; bool fail = 3; }
message ControlReply { string token = 1; }
message Counts { uint64 started = 1; uint64 completed = 2; uint64 cancelled = 3; uint64 failed = 4; }
service Control {
  rpc Wait(ControlRequest) returns (ControlReply);
  rpc Inspect(Empty) returns (Counts);
}
